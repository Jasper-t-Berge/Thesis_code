[build-system]
requires      = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name            = "hysteron"
version         = "1.0.0"
description     = "Simulation and inverse design of fluidic hysteron valve networks"
readme          = "README.md"
requires-python = ">=3.9"
license         = { file = "LICENSE" }
authors         = [{ name = "Jasper ten Berge" }]
dependencies    = [
    "numpy",
    "matplotlib",
    "networkx",
    "cma",
]

[tool.setuptools]
packages = ["hysteron"]
